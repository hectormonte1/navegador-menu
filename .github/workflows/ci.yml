name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests (no system preference changes)
        run: bash scripts/test.sh
      - name: Apple Silicon build
        run: ARCH=arm64 bash build.sh
      - name: Intel build
        run: ARCH=x86_64 bash build.sh
