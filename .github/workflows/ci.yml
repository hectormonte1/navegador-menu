name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (no system preference changes)
        run: bash scripts/test.sh
      - name: Apple Silicon build
        run: ARCH=arm64 bash build.sh
      - name: Intel build
        run: ARCH=x86_64 bash build.sh
